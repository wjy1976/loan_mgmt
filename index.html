// === 工具：body 捲軸鎖定 (modal 開啟/關閉用) ===
// 鎖定 = 隱藏捲軸避免背景被滑動；解開 = 恢復原本狀態
let bodyScrollLockCount = 0; // 支援多個 modal 同時開 (巢狀計數)
const lockBodyScroll = (lock) => {
    if (lock) {
        bodyScrollLockCount++;
        if (bodyScrollLockCount === 1) {
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';
            document.body.classList.add('overflow-hidden');
        }
    } else {
        bodyScrollLockCount = Math.max(0, bodyScrollLockCount - 1);
        if (bodyScrollLockCount === 0) {
            document.body.style.overflow = '';
            document.body.style.position = '';
            document.body.style.width = '';
            document.body.classList.remove('overflow-hidden');
        }
    }
};

// === 工具：取得當前使用者可看到的 records ===
// 規則：
//   1. 試用模式：只看 'demo' 帳號

//   3. 一般使用者：只看自己的
//   4. 管理員 + viewingUid === 'all'：看全部
const getVisibleRecords = () => {
    if (state.isDemoMode) return state.records.filter(r => r.ownerUid === 'demo');
    if (state.isAdmin && state.viewingUid !== 'all' && state.viewingUid !== null) {
        return state.records.filter(r => r.ownerUid === state.viewingUid);

const showMessage = (message, type) => {
    const container = document.getElementById('message-container');
    if (!container) return;
    const isError = type === 'error';
    const bgColor = isError ? 'bg-red-50 border-red-300' : 'bg-emerald-50 border-emerald-300';
    const textColor = isError ? 'text-red-700' : 'text-emerald-700';
    const icon = isError ? 'x-circle' : 'check-circle';
    const messageBox = document.createElement('div');
    messageBox.className = `p-4 mt-3 border rounded-xl shadow-lg flex items-start space-x-3 animate-fade-in pointer-events-auto ${bgColor}`;
    messageBox.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0 ${textColor}"></i><p class="text-sm font-medium ${textColor}">${message}</p>`;
    container.prepend(messageBox);
    lucide.createIcons();
    setTimeout(() => messageBox.remove(), 4000);
};
window.showError = (message) => showMessage(message, 'error');
window.showSuccess = (message) => showMessage(message, 'success');
window.showConfirm = (message, callback) => {
    const modal = document.getElementById('confirm-modal');
    const msgEl = document.getElementById('confirm-message');
    const okBtn = document.getElementById('confirm-ok');
    const cancelBtn = document.getElementById('confirm-cancel');
    if (!modal || !msgEl || !okBtn || !cancelBtn) return;
    msgEl.textContent = message;
    modal.classList.remove('hidden');
    const newOk = okBtn.cloneNode(true); okBtn.parentNode.replaceChild(newOk, okBtn);
    const newCancel = cancelBtn.cloneNode(true); cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
    const closeAndClean = () => modal.classList.add('hidden');
    newOk.addEventListener('click', () => { closeAndClean(); callback(true); });

const formatNumber = (num) => {
    if (typeof num === 'string' && !/^-?\d/.test(num)) return num;
    if (num === '∞' || num === '-') return num;
    if (num === null || num === undefined || num === '') return "";
    const n = Number(num);
    if (isNaN(n)) return num;
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
};
const formatCaseId = (num) => `#${String(num).padStart(3, '0')}`;

const extractDatesFromSchedule = (scheduleStr) => {
    if (!scheduleStr) return [];
    const regex = /\b(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\b/g;
    const matches = []; let match;

// === 計算第一個應繳日 (借款日 >= 還款日 → 借款當月不算第一期) ===
// 規則：
//   - 借款日.day >= 還款日.day → 回傳 null（表示「當月不算第一期」，沿用預設「借款月 + 1」）
//     原因：當月已過還款日，當月不可能還款
//   - 借款日.day < 還款日.day → 回傳第一期日期（當月就算第一期）
//   - 協商 (status 5) 不適用：協商從協商期開始算，不是從借款日
//   - repayDay 沒填或無效：回傳 null（保守起見，沿用預設「借款月 + 1」）
const getFirstRepayDate = (loanDate, dueDay, status) => {
    if (!loanDate || isNaN(loanDate.getTime())) return null;
    if (String(status) === '5') return null; // 協商不適用
    if (!dueDay || dueDay < 1 || dueDay > 31) return null; // repayDay 沒填或無效
    if (loanDate.getDate() >= dueDay) return null; // 當月不算第一期（沿用預設）

    const lastDay = new Date(loanDate.getFullYear(), loanDate.getMonth() + 1, 0).getDate();
    return new Date(loanDate.getFullYear(), loanDate.getMonth(), Math.min(dueDay, lastDay));

const getPaymentStatus = (record) => {
    if (record.status === '4') return { isPaid: true, isOverdue: false, showNoPayDaySetting: false };
    const dates = extractDatesFromSchedule(record.schedule);
    const now = new Date(); const currentMonth = now.getMonth(); const currentYear = now.getFullYear();
    let isPaidThisMonth = false;

    if (!isPaidThisMonth && record.lastRepaymentDate) {
        const lastDate = new Date(record.lastRepaymentDate);
        if (lastDate.getMonth() === currentMonth && lastDate.getFullYear() === currentYear) isPaidThisMonth = true;

    if (record.status === '0') return { isPaid: true, isOverdue: false, showNoPayDaySetting: false };
    let repayDay = null; if (record.repayDay) { const match = String(record.repayDay).match(/(\d+)/); if (match) repayDay = parseInt(match[1], 10); }
    // 計算借款月
    const loanDate = record.date ? new Date(String(record.date).replace(/\//g, '-')) : null;
    const isInLoanMonth = loanDate && !isNaN(loanDate.getTime()) &&
        loanDate.getFullYear() === now.getFullYear() && loanDate.getMonth() === now.getMonth();
    const isNegotiation = String(record.status) === '5';
    // ★ Q2: repayDay 沒填 + 借款當月 + 非協商 → 顯示「無還款日設定」（不觸發逾期）
    const showNoPayDaySetting = !repayDay && isInLoanMonth && !isNegotiation;
    let isOverdue = false;
    if (!isPaidThisMonth && repayDay) {

const parseSchedule = (scheduleStr) => {
    if (!scheduleStr) return [];
    const lines = scheduleStr.split('\n').filter(l => l.trim() !== '');
    return lines.map(line => {
        const dateMatch = line.match(/^(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
        let pMatch = line.match(/本金:(\d+)/);
        let iMatch = line.match(/利息:(\d+)/);
        if (!pMatch) pMatch = line.match(/P:(\d+)/);
        if (!iMatch) iMatch = line.match(/I:(\d+)/);
        const date = dateMatch ? new Date(dateMatch[1].replace(/\//g, '-')) : null;
        const principal = pMatch ? parseInt(pMatch[1], 10) : 0;
        const interest = iMatch ? parseInt(iMatch[1], 10) : 0;
        return { date, principal, interest, raw: dateMatch ? `${dateMatch[0]} 本金:${principal} 利息:${interest}` : line };
    }).filter(item => item.date !== null);
};
const cleanFormDataForSave = (data) => {

};
const calculateDerivedData = (record) => {
    const loanAmount = Number(record.loanAmount) || 0;
    const disbursed = Number(record.disbursed) || 0;
    const entries = parseSchedule(record.schedule);
    let totalPrincipalPaid = 0, totalInterestPaid = 0;
    entries.forEach(e => { totalPrincipalPaid += e.principal; totalInterestPaid += e.interest; });
    if (record.status === '4') {
        let outstanding = record.outstandingPrincipal !== undefined ? Number(record.outstandingPrincipal) : (disbursed - totalPrincipalPaid - totalInterestPaid);
        let arrears = record.arrears !== undefined ? Number(record.arrears) : (loanAmount - totalPrincipalPaid);
        outstanding = Math.max(0, outstanding); arrears = Math.max(0, arrears);
        return { outstanding, arrears, remainingTerms: '-', roiTerms: '-', totalPrincipalPaid, totalInterestPaid };
    }
    if (record.status === '0' || record.status === '2') {
        let outstanding = 0;
        let arrears = record.status === '0' ? 0 : (loanAmount - totalPrincipalPaid);
        arrears = Math.max(0, arrears);
        return { outstanding, arrears, remainingTerms: '-', roiTerms: '-', totalPrincipalPaid, totalInterestPaid };
    }
    if (record.status === '5') {
        const negotiationPrincipal = Number(record.negotiationPrincipal) || 0;
        const totalNegotiationPaid = entries.reduce((sum, e) => sum + e.principal, 0);
        const totalInterestPaid2 = entries.reduce((sum, e) => sum + e.interest, 0);
        let outstanding = disbursed - totalNegotiationPaid - totalInterestPaid2;
        let arrears = loanAmount - totalNegotiationPaid;
        outstanding = Math.max(0, outstanding); arrears = Math.max(0, arrears);
        let remainingTerms = '-';
        if (negotiationPrincipal > 0 && arrears > 0) remainingTerms = Math.ceil(arrears / negotiationPrincipal);
        return { outstanding, arrears, remainingTerms, roiTerms: remainingTerms, totalPrincipalPaid: totalNegotiationPaid, totalInterestPaid: totalInterestPaid2, isNegotiation: true, negotiationPrincipal };
    }
    let outstanding = disbursed - totalPrincipalPaid - totalInterestPaid;
    let arrears = loanAmount - totalPrincipalPaid;
    outstanding = Math.max(0, outstanding); arrears = Math.max(0, arrears);
    let remainingTerms = '-', roiTerms = "-";
    const method = record.method || '';
    const isSpecialMethod = ['設定', '票貼', '小額'].includes(method);
    if (isSpecialMethod) {
        // 票貼/小額/設定 沒有每期還本金，但有還利息，
        // 回本餘期 = ceil(在外本金 / 每月利息)，代表「本金等值月利息期數」
        const termInterestSp = Number(record.interestPerTerm) || 0;
        if (record.status === '3') {
            roiTerms = "∞";
        } else if (outstanding > 0 && termInterestSp > 0) {
            const monthsEquivalent = Math.ceil(outstanding / termInterestSp);
            remainingTerms = monthsEquivalent;
            roiTerms = monthsEquivalent;
        } else if (outstanding <= 0) {
            remainingTerms = "0";
            roiTerms = "0";
        } else {
            // 沒利息資訊或剛開始沒在外本金
            remainingTerms = '-';
            roiTerms = '-';
        }
    } else {
        const terms = Number(record.terms) || 0;
        const repaidTerms = entries.length;
        let val = terms - repaidTerms; if (val < 0) val = 0;
        remainingTerms = Math.floor(val);
        const termPrincipal = Number(record.principalPerTerm) || 0;
        const termInterest = Number(record.interestPerTerm) || 0;
        const termTotal = termPrincipal + termInterest;
        if (record.status === '3') roiTerms = "∞";
        else if (record.status === '1') {
            if (termTotal > 0 && outstanding > 0) {
                let val2 = outstanding / termTotal;
                if (val2 < 0) val2 = 0;
                roiTerms = val2 === Infinity ? "∞" : Math.ceil(val2);
            } else if (outstanding <= 0) roiTerms = "0";
        }
    }
    return { outstanding, arrears, remainingTerms, roiTerms, totalPrincipalPaid, totalInterestPaid };
};

const getLastRepaymentDateStr = (record) => {

// === 漏期計算 (Issue 1 - 彈卡支援) ===
// 規則：
// 1. 預期應繳日 = 放款日 + N 個月（以「每期還款日」為基準日）
// 2. 過濾：未來不計、當月未到繳款日也不計
// 3. 分配：每筆還款依日期由舊到新，分配到「<= 該還款日」且「尚未被分配」的最新一筆預期應繳日
// 4. 漏期 = 預期未分配的應繳日清單
const calculateMissedPeriods = (record, now) => {
    if (!record) return [];
    if (record.status === '0' || record.status === '4') return []; // 結案不計漏期
    if (!record.date) return [];
    now = now || new Date();
    const loanDate = new Date(String(record.date).replace(/\//g, '-'));
    if (isNaN(loanDate.getTime())) return [];
    // 取得每期還款日
    let dueDay = null;
    if (record.repayDay) {
        const m = String(record.repayDay).match(/(\d+)/);
        if (m) dueDay = parseInt(m[1], 10);
    }
    if (!dueDay || dueDay < 1 || dueDay > 31) dueDay = loanDate.getDate();
    // 計算第一個預期應繳日 = 放款日 + 1 個月
    let firstDue = new Date(loanDate);
    firstDue.setMonth(firstDue.getMonth() + 1);
    let fY = firstDue.getFullYear();
    let fM = firstDue.getMonth();
    let lastDayFirst = new Date(fY, fM + 1, 0).getDate();
    firstDue.setDate(Math.min(dueDay, lastDayFirst));
    // 特殊情況：借款日 < 還款日 → 當月就是第一期
    // （例如：7/3 借款、還款日 5 號 → 7/5 該還，所以 7 月就是第一期）
    // 借款日 >= 還款日 → 沿用預設 firstDue = 借款月 + 1
    // 協商 (status 5) 不適用：協商從協商期開始算
    // repayDay 沒填：沿用預設（不觸發新規則）
    if (String(record.status) !== '5') {
        const firstRepay = getFirstRepayDate(loanDate, dueDay, record.status);
        if (firstRepay) {
            // 借款日 < 還款日 → 當月就是第一期
            firstDue = firstRepay;
        }
        // 否則 firstDue 保持 = 借款月 + 1（預設）
    }
    // 產生所有預期應繳日 (到今天為止)
    const expectedDues = [];
    let nextDue = new Date(firstDue);
    const maxPeriods = Math.max(Number(record.terms) || 0, 60);
    for (let i = 0; i < maxPeriods; i++) {
        if (nextDue > now) break;
        expectedDues.push(new Date(nextDue));
        const ny = nextDue.getFullYear();
        const nm = nextDue.getMonth() + 1;
        const lastDay = new Date(ny, nm + 1, 0).getDate();
        nextDue = new Date(ny, nm, Math.min(dueDay, lastDay));
    }
    // 分配還款 (規則：過去優先，找不到才用同月)
    // 1. 優先：<= 還款日的最近一筆尚未分配預期應繳日 (處理延遲情況)
    // 2. 退而求其次：同月尚未分配的預期應繳日 (處理提前還款的情況)
    const entries = parseSchedule(record.schedule || '');
    entries.sort((a, b) => (a.date || 0) - (b.date || 0));
    const covered = new Set();
    for (const entry of entries) {
        if (!entry.date) continue;
        const payDate = entry.date;
        const payY = payDate.getFullYear();
        const payM = payDate.getMonth();
        let allocated = null;
        // 1) 過去優先：找 <= 還款日 的最近一筆未分配
        for (let i = expectedDues.length - 1; i >= 0; i--) {
            const d = expectedDues[i];
            if (d <= payDate && !covered.has(d.getTime())) {
                allocated = d;
                break;
            }
        }
        // 2) 找不到才用同月 (處理還款日早於該月應繳日的情況，如 8/10 還款但 8/20 才應繳)
        if (!allocated) {
            for (let i = expectedDues.length - 1; i >= 0; i--) {
                const d = expectedDues[i];
                if (d.getFullYear() === payY && d.getMonth() === payM && !covered.has(d.getTime())) {
                    allocated = d;
                    break;
                }
            }
        }
        if (allocated) covered.add(allocated.getTime());
    }
    return expectedDues.filter(d => !covered.has(d.getTime()));
};

const calculateStats = () => {
    const s = {
        totalIncome: 0, creditAmount: 0, outstanding: 0, monthCollected: 0, monthInterestCollected: 0, monthDue: 0, monthInterestDue: 0,
        borrowers: 0, badDebtAmount: 0, currentLent: 0, monthDiff: 0, monthInterestDiff: 0, totalManagementFee: 0,
        activeCases: 0, unpaidCount: 0, normalClosedCount: 0, closedBadDebtCount: 0, activeBadDebtCount: 0,
        unpaidRecords: [], closedRecords: [], activeRecords: [], badDebtCases: [], managedCases: 0, managedRecords: [],
        negotiationCases: 0, negotiationRecords: [], negotiationDue: 0, negotiationCollected: 0, hasManagedCases: false,
        status1Income: 0, status2Income: 0, status3Income: 0, status4Income: 0, status5Income: 0,
        netIncome: 0, monthActualCollected: 0, monthActualInterestCollected: 0
    };
    const uniqueBorrowers = new Set();
    const now = new Date(); const currentMonth = now.getMonth(); const currentYear = now.getFullYear();
    let displayRecords = state.records;
    displayRecords = getVisibleRecords();
    const searchTerm = state.searchTerm.toLowerCase();
    const filtered = displayRecords.filter(r => (r.borrower?.toLowerCase().includes(searchTerm) || r.displayId?.toLowerCase().includes(searchTerm) || r.method?.toLowerCase().includes(searchTerm)));
    filtered.forEach(r => {
        const calc = calculateDerivedData(r);
        const principal = Number(r.principalPerTerm) || 0;
        const termInterest = Number(r.interestPerTerm) || 0;
        const negotiationPrincipal = Number(r.negotiationPrincipal) || 0;
        const interestIncome = calc.totalInterestPaid || 0;
        if (r.status === '1') s.status1Income += interestIncome;
        else if (r.status === '2') s.status2Income += interestIncome;
        else if (r.status === '3') s.status3Income += interestIncome;
        else if (r.status === '4') s.status4Income += interestIncome;
        else if (r.status === '5') s.status5Income += interestIncome;
        s.totalIncome += interestIncome;
        if (r.status === '5') {
            s.creditAmount += calc.arrears;
            s.currentLent += Number(r.loanAmount) || 0;
            s.outstanding += calc.outstanding;
            s.negotiationDue += negotiationPrincipal;
            const entries = parseSchedule(r.schedule);
            const currentMonthPaid = entries.filter(e => e.date && e.date.getFullYear() === currentYear && e.date.getMonth() === currentMonth).reduce((sum, e) => sum + e.principal, 0);
            s.negotiationCollected += currentMonthPaid;
            s.monthDue += negotiationPrincipal;
            s.monthActualCollected += currentMonthPaid;
            s.badDebtAmount += calc.arrears;
            s.activeBadDebtCount++;
            s.badDebtCases.push(r);
            s.negotiationCases++;
            s.negotiationRecords.push(r);
            const { isPaid } = getPaymentStatus(r);
            if (!isPaid) s.monthDiff += negotiationPrincipal;
        } else if (r.status === '1' || r.status === '3') {
            s.creditAmount += calc.arrears;
            s.currentLent += Number(r.loanAmount) || 0;
            s.outstanding += calc.outstanding;
            if (r.status === '1') {
                s.monthDue += (principal + termInterest);
                s.monthInterestDue += termInterest;
            }
            if (r.status === '3') {
                s.badDebtAmount += calc.arrears;
                s.activeBadDebtCount++;
                s.badDebtCases.push(r);
            }
        } else if (r.status === '4') {
            s.badDebtAmount += calc.arrears;
            s.closedBadDebtCount++;
            s.badDebtCases.push(r);
        } else if (r.status === '2') {
            s.monthDue += termInterest;
            s.monthInterestDue += termInterest;
            s.hasManagedCases = true;
            s.totalManagementFee += termInterest;
            s.managedCases++;
            s.managedRecords.push(r);
        }
        if (r.status === '0') { s.normalClosedCount++; s.closedRecords.push(r); }
        else if (r.status === '1') {
            s.activeCases++; s.activeRecords.push(r);
            const { isOverdue } = getPaymentStatus(r);
            if (isOverdue) { s.unpaidCount++; s.unpaidRecords.push(r); }
        } else if (r.status === '2') {
            const { isPaid } = getPaymentStatus(r);
            if (!isPaid) {
                s.monthDiff += termInterest;
                s.monthInterestDiff += termInterest;
            }
        }
        if (r.status === '1' || r.status === '2' || r.status === '5') {
            const entries = parseSchedule(r.schedule);
            const currentMonthEntries = entries.filter(e => e.date && e.date.getFullYear() === currentYear && e.date.getMonth() === currentMonth);
            currentMonthEntries.forEach(e => {
                s.monthActualCollected += e.principal + e.interest;
                s.monthActualInterestCollected += e.interest;
            });
        }
        if (r.borrower) uniqueBorrowers.add(r.borrower);
    });
    s.borrowers = uniqueBorrowers.size;
    s.netIncome = s.totalIncome - s.badDebtAmount;
    s.monthDiff = s.monthDue - s.monthActualCollected; if (s.monthDiff < 0) s.monthDiff = 0;
    s.monthInterestDiff = s.monthInterestDue - s.monthActualInterestCollected; if (s.monthInterestDiff < 0) s.monthInterestDiff = 0;
    s.monthCollected = s.monthActualCollected;
    s.monthInterestCollected = s.monthActualInterestCollected;
    return s;
};

window.updateFormData = (key, val, shouldRender = false) => {
    formData[key] = val;
    const loan = Number(formData.loanAmount) || 0;
    const t = Number(formData.terms) || 0;
    const interestRate = (parseFloat(formData.interestRate) || 0) / 100;
    const specialRate = (parseFloat(formData.specialRate) || 0) / 100;
    if (key === 'status' && val === '5') {
        formData.terms = ''; formData.interestRate = ''; formData.principalPerTerm = ''; formData.interestPerTerm = ''; formData.repayDay = ''; formData.method = '叨簿子';
    }
    if (key === 'status' && val !== '5' && formData.status === '5') formData.negotiationPrincipal = '';
    if (key === 'loanAmount' || key === 'terms' || key === 'status' || key === 'method') {
        if (formData.status === '2') {
            if (formData.method === '叨簿子') {
                const principalPerTerm = t > 0 ? Math.round(loan / t) : 0;
                const interestToClient = Math.round(loan * (specialRate - interestRate));
                const managementFee = Math.round(loan * interestRate);
                formData.principalPerTerm = principalPerTerm;
                formData.interestPerTerm = managementFee;
                formData.expectedPayment = interestToClient + principalPerTerm;
            } else {
                const interestToClient = Math.round(loan * (specialRate - interestRate));
                const managementFee = Math.round(loan * interestRate);
                formData.principalPerTerm = 0;
                formData.interestPerTerm = managementFee;
                formData.expectedPayment = interestToClient;
            }
        } else if (formData.status === '5') {
            formData.principalPerTerm = 0; formData.interestPerTerm = 0; formData.terms = 0;
        } else if ((formData.status === '1' || formData.method === '叨簿子') && t > 0) formData.principalPerTerm = Math.round(loan / t);
        if (['設定','票貼','小額'].includes(formData.method)) { formData.principalPerTerm = 0; formData.terms = 0; }
    }
    if (key === 'status' || key === 'loanAmount' || key === 'interestRate' || key === 'specialRate') {
        if (formData.status === '2') {
            const loan2 = Number(formData.loanAmount) || 0;
            const t2 = Number(formData.terms) || 0;
            const ir = (parseFloat(formData.interestRate) || 0) / 100;
            const sr = (parseFloat(formData.specialRate) || 0) / 100;
            if (formData.method === '叨簿子') {
                const principalPerTerm = t2 > 0 ? Math.round(loan2 / t2) : 0;
                const interestToClient = Math.round(loan2 * (sr - ir));
                const managementFee = Math.round(loan2 * ir);
                formData.principalPerTerm = principalPerTerm;
                formData.interestPerTerm = managementFee;
                formData.expectedPayment = interestToClient + principalPerTerm;
            } else {
                const interestToClient = Math.round(loan2 * (sr - ir));
                const managementFee = Math.round(loan2 * ir);
                formData.principalPerTerm = 0;
                formData.interestPerTerm = managementFee;
                formData.expectedPayment = interestToClient;
            }
        } else if (formData.status !== '5') {
            formData.interestPerTerm = Math.round(loan * interestRate);
        }
    }
    if (shouldRender) renderApp();
    else {
        const setVal = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
        const setText = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
        setVal('input_principalPerTerm', formData.principalPerTerm);
        setVal('input_interestPerTerm', formData.interestPerTerm);
        const calc = calculateDerivedData(formData);
        setText('display_arrears', formatNumber(calc.arrears));
        setText('display_outstanding', formatNumber(calc.outstanding));
        if(formData.status === '2') setVal('input_expectedPayment', formatNumber(formData.expectedPayment || 0));
        if(document.getElementById('input_negotiationPrincipal')) setVal('input_negotiationPrincipal', formData.negotiationPrincipal || '');
    }
};

const MAP_ROWS = { STATUS:0, CATEGORY:1, LOAN_DATE:2, BORROWER:3, JOB:4, AMOUNT:5, ACTUAL_AMOUNT:6, INTEREST_RATE:7, AGENT:8, PERIODS:9, RULE_DAY:10, HISTORY_START:11 };
const cleanNumber = (val) => val ? parseFloat(String(val).replace(/,/g, '').replace(/%/g, '').trim()) : 0;
const parseCSV = (text) => {
    const rawRows = text.trim().split(/\r\n|\n/).filter(row => row.trim() !== '');
    const rows = rawRows.map(row => {
        const values = [];
        let current = '', inQuotes = false;
        for (let j = 0; j < row.length; j++) {
            const char = row[j];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
            else current += char;
        }
        values.push(current.trim());
        return values.map(v => v.replace(/^"(.*)"$/, '$1').replace(/""/g, '"'));
    });
    if (rows.length === 0) return [];
    const parsedCases = [];
    const totalCols = rows[0].length;
    const startingCol = 1;
    for (let col = startingCol; col < totalCols; col++) {
        const borrowerName = rows[MAP_ROWS.BORROWER]?.[col]?.trim();
        const loanAmount = cleanNumber(rows[MAP_ROWS.AMOUNT]?.[col]);
        if (!borrowerName && loanAmount === 0) continue;
        let status = String(rows[MAP_ROWS.STATUS]?.[col] || '1').trim();
        const terms = cleanNumber(rows[MAP_ROWS.PERIODS]?.[col]);
        const interestRateFloat = cleanNumber(rows[MAP_ROWS.INTEREST_RATE]?.[col]) / 100;
        if (!['0','1','2','3','4','5'].includes(status)) {
            const statusText = status.toLowerCase();
            if (statusText.includes('進行')||statusText.includes('正常')) status='1';
            else if (statusText.includes('代管')) status='2';
            else if (statusText.includes('呆帳')) status='3';
            else if (statusText.includes('結案')) status='0';
            else if (statusText.includes('協商')) status='5';
            else status='1';
        }
        let principalPerTerm = 0, interestPerTerm = 0, negotiationPrincipal = 0;
        if (status === '5') negotiationPrincipal = Math.round(loanAmount * 0.05);
        else if (status !== '2' && terms > 0) principalPerTerm = Math.round(loanAmount / terms);
        if (status !== '5') interestPerTerm = Math.round(loanAmount * interestRateFloat);
        const scheduleLines = [];
        let lastRepaymentDate = '';
        const scheduleRowIndex = rows.findIndex(row => row[0]?.includes('還款日程'));
        if (scheduleRowIndex !== -1 && rows[scheduleRowIndex]?.[col]) {
            const scheduleText = rows[scheduleRowIndex][col];
            if (scheduleText) {
                const scheduleEntries = scheduleText.split('|').map(entry => entry.trim());
                scheduleEntries.forEach(entry => {
                    if (entry) {
                        const dateMatch = entry.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
                        const principalMatch = entry.match(/本金[:\s]*(\d+)/);
                        const interestMatch = entry.match(/利息[:\s]*(\d+)/);
                        if (dateMatch) {
                            const cleanDate = dateMatch[0].replace(/\//g, '-');
                            const principal = principalMatch ? parseInt(principalMatch[1],10) : (status==='5'?negotiationPrincipal:principalPerTerm);
                            const interest = interestMatch ? parseInt(interestMatch[1],10) : interestPerTerm;
                            scheduleLines.push(`${cleanDate} 本金:${principal} 利息:${interest}`);
                        }
                    }
                });
            }
        }
        if (scheduleLines.length === 0) {
            for (let rowIdx = MAP_ROWS.HISTORY_START; rowIdx < rows.length; rowIdx++) {
                const historyDateStr = rows[rowIdx]?.[col]?.trim();
                if (historyDateStr && /\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(historyDateStr)) {
                    const cleanDate = historyDateStr.replace(/\//g, '-');
                    const entry = `${cleanDate} 本金:${status==='5'?negotiationPrincipal:principalPerTerm} 利息:${interestPerTerm}`;
                    scheduleLines.push(entry);
                }
            }
        }
        const sortedSchedule = sortScheduleLines(scheduleLines).join('\n');
        const repaidTermsCount = extractDatesFromSchedule(sortedSchedule).length;
        const totalInterestIncome = status==='5' ? scheduleLines.reduce((sum,line)=>{ const m=line.match(/利息:(\d+)/); return sum+(m?parseInt(m[1],10):0); },0) : repaidTermsCount*interestPerTerm;
        if (repaidTermsCount > 0) {
            const allDates = extractDatesFromSchedule(sortedSchedule);
            allDates.sort((a,b)=>b-a);
            if (allDates.length>0) lastRepaymentDate = allDates[0].toISOString().split('T')[0];
        }
        let loanDate = rows[MAP_ROWS.LOAN_DATE]?.[col] || '';
        if (loanDate) {
            const dateMatch = loanDate.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
            if (dateMatch) loanDate = `${dateMatch[1]}-${dateMatch[2].padStart(2,'0')}-${dateMatch[3].padStart(2,'0')}`;
        }
        const newCase = {
            status, method: rows[MAP_ROWS.CATEGORY]?.[col] || '', date: loanDate,
            borrower: borrowerName || `未知借款人_${col}`, job: rows[MAP_ROWS.JOB]?.[col] || '',
            loanAmount, disbursed: cleanNumber(rows[MAP_ROWS.ACTUAL_AMOUNT]?.[col]) || loanAmount,
            interestRate: cleanNumber(rows[MAP_ROWS.INTEREST_RATE]?.[col]) || 0,
            agent: rows[MAP_ROWS.AGENT]?.[col] || '', terms, repayDay: rows[MAP_ROWS.RULE_DAY]?.[col] || '',
            principalPerTerm, interestPerTerm, negotiationPrincipal: status==='5'?negotiationPrincipal:0,
            schedule: sortedSchedule, repaidTerms: repaidTermsCount, totalInterestIncome,
            lastRepaymentDate, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
            note: rows.find(row => row[0]?.includes('附註'))?.[col] || '',
            idNumber: '', address: '', telephone: '', mobile: ''
        };
        parsedCases.push(newCase);
    }
    return parsedCases;
};

const computeIncomeTrend = () => {
    let targetRecords = state.records;
    targetRecords = getVisibleRecords();
    const monthlyMap = new Map(), yearlyMap = new Map();
    targetRecords.forEach(record => {
        const entries = parseSchedule(record.schedule || '');
        entries.forEach(entry => {
            if (entry.date && entry.interest > 0) {
                const year = entry.date.getFullYear();
                const month = entry.date.getMonth()+1;
                const monthKey = `${year}-${String(month).padStart(2,'0')}`;
                const yearKey = `${year}`;
                monthlyMap.set(monthKey, (monthlyMap.get(monthKey)||0) + entry.interest);
                yearlyMap.set(yearKey, (yearlyMap.get(yearKey)||0) + entry.interest);
            }
        });
    });
    const months = Array.from(monthlyMap.keys()).sort();
    const monthData = months.map(m => monthlyMap.get(m));
    const years = Array.from(yearlyMap.keys()).sort();
    const yearData = years.map(y => yearlyMap.get(y));
    return { months, monthData, years, yearData };
};
const getIncomeDetailForPeriod = (period, isMonth) => {
    let targetRecords = state.records;
    targetRecords = getVisibleRecords();
    const detailMap = new Map();
    targetRecords.forEach(record => {
        const entries = parseSchedule(record.schedule || '');
        entries.forEach(entry => {
            if (entry.date && entry.interest > 0) {
                let match = false;
                if (isMonth) {
                    const yearMonth = `${entry.date.getFullYear()}-${String(entry.date.getMonth()+1).padStart(2,'0')}`;
                    if (yearMonth === period) match = true;
                } else {
                    const year = `${entry.date.getFullYear()}`;
                    if (year === period) match = true;
                }
                if (match) {
                    const current = detailMap.get(record.id) || { record, amount: 0 };
                    current.amount += entry.interest;
                    detailMap.set(record.id, current);
                }
            }
        });
    });
    const details = Array.from(detailMap.values());
    details.sort((a,b)=>b.amount - a.amount);
    return details;
};
const showIncomeDetailModal = (period, isMonth, totalAmount) => {
    const details = getIncomeDetailForPeriod(period, isMonth);

// === 呆帳趨勢 (「各月底待追回金額」模型) ===
// 規則：
//   - 取狀態 3 / 4 / 5 的案件
//   - 呆帳發生點 = 最後繳款日的下一個月 (沒有的話用放款日)
//   - 狀態 3 / 4：金額不動 (以實際 arrears / outstandingPrincipal 為準)
//   - 狀態 5：依 schedule 實際還款記錄，計算各月底剩餘
//   - 表格每個月的數字 = 該月底「待追回的呆帳金額」總和
//   - 沒日期的案件：不計入過去月份，只出現在「現在這個月」(代表我們不知道何時開始)
// 呆帳起始月 = 最後一次「本金+利息都繳」的下一個月
// - 狀態 5 (協商)：協商期間只繳本金沒繳利息，所以「最後一次本金+利息都繳」= 協商前的最後一次正常還款
// - 狀態 3/4：找最後一次正常還款
// - 找不到任何正常還款：fallback 到 record.date
const getBadDebtStartDate = (record) => {
    const tryParse = (val) => {
        if (!val) return null;
        if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
        const d = new Date(String(val).replace(/\//g, '-'));
        return isNaN(d.getTime()) ? null : d;
    };
    // 用 schedule 找最後一次「本金>0 且 利息>0」的日期
    const scheduleStr = String(record.schedule || '');
    if (scheduleStr.trim()) {
        const entries = parseSchedule(scheduleStr);
        const fullPayments = entries
            .filter(e => e.date && (e.principal || 0) > 0 && (e.interest || 0) > 0)
            .map(e => e.date)
            .sort((a, b) => a - b);
        if (fullPayments.length > 0) {
            const lastFull = fullPayments[fullPayments.length - 1];
            const next = new Date(lastFull.getFullYear(), lastFull.getMonth() + 1, 1);
            return next;
        }
    }
    // 找不到任何正常還款：fallback 到 record.date (視為開始月)
    const d2 = tryParse(record.date);
    if (d2) return new Date(d2.getFullYear(), d2.getMonth(), 1);
    return null;
};
const computeBadDebtTrend = () => {
    let targetRecords = state.records;
    if (state.isDemoMode) targetRecords = state.records.filter(r => r.ownerUid === 'demo');
    else if (state.isAdmin && state.viewingUid !== 'all' && state.viewingUid !== null) targetRecords = state.records.filter(r => r.ownerUid === state.viewingUid);
    else if (!state.isAdmin && !state.isDemoMode) targetRecords = state.records.filter(r => r.ownerUid === state.currentUserUid);
    // 取狀態 3 / 4 / 5 (用 String 轉換相容 number)
    const badDebtCases = targetRecords.filter(r => {
        const s = String(r.status);
        return s === '3' || s === '4' || s === '5';
    });
    // 計算每個案件的起始月份與衰減資訊 (不再過濾掉沒有日期的)
    const cases = badDebtCases.map(record => {
        const startDate = getBadDebtStartDate(record);
        // ★ 改用 calculateDerivedData 算 arrears (與 Dashboard 一致)
        // Dashboard 的「呆帳金額」= sum(calc.arrears for status 3/4/5)
        // 用戶規則：呆帳應該有欠款；如已還完應該是 status 0
        let calc;
        try { calc = calculateDerivedData(record); } catch (e) { calc = { arrears: 0 }; }
        const currentArrears = Math.max(0, Number(calc.arrears) || 0);
        // ★ 所有狀態都拿 schedule entries 以便反推歷史月份的還款軌跡
        // 狀態 3：壞帳有時會在結清前慢慢還款
        // 狀態 4：結算後可能也會繼續慢慢還
        // 狀態 5：協商按 schedule 還款
        const scheduleEntries = parseSchedule(record.schedule || '').filter(e => e.date && (e.principal || 0) > 0).sort((a, b) => a.date - b.date);
        // ★ 執行狀態 (僅限狀態 3)：有 'completed' 表示執行已結案，應排除
        const isExecuted = String(record.executionStatus || '') === 'completed';
        return {
            record,
            startDate, // 可能是 null (無日期)
            loanAmount: Number(record.loanAmount) || 0,
            currentArrears, // 當前待追回金額 (與 Dashboard badDebtAmount 一致)
            scheduleEntries,
            isStatus3: String(record.status) === '3',
            isStatus4: String(record.status) === '4',
            isStatus5: String(record.status) === '5',
            isExecuted  // 強制執行已結案 → 排除
        };
    });
    // ★ 列出每件案件的 currentArrears，方便驗證是否跟 Dashboard 一致
    const totalArrears = cases.reduce((s, c) => s + c.currentArrears, 0);
    if (cases.length === 0) {
        return { months: [], monthData: [], years: [], yearData: [] };
    }
    // ★ debug 訊息 (跟据問題需要)
    const noDateCases = cases.filter(c => !c.startDate);
    if (noDateCases.length > 0) {
        // 原始 console.log 已被移除 (用戶要求)
    }
    // 時間範圍：有日期的案件最早月 ~ 現在
    const datedCases = cases.filter(c => c.startDate);
    const minStart = datedCases.length > 0
        ? datedCases.reduce((a, c) => c.startDate < a ? c.startDate : a, datedCases[0].startDate)
        : new Date();
    const now = new Date();
    const months = [];
    const cursor = new Date(minStart.getFullYear(), minStart.getMonth(), 1);
    let safety = 0;
    while (safety++ < 240) {
        const key = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}`;
        months.push(key);
        if (cursor.getFullYear() === now.getFullYear() && cursor.getMonth() === now.getMonth()) break;
        cursor.setMonth(cursor.getMonth() + 1);
    }
    const lastMonth = months[months.length - 1];
    const [lastY, lastM] = lastMonth.split('-').map(Number);
    const lastMonthEnd = new Date(lastY, lastM, 0);  // 當月月底 (「現在」邊界)
    // 計算每個月的總金額
    // ★ 用戶規則：
    //   - 件數 = 全部狀態 3/4/5 (不過濾 balance) - 但排除已執行結案的
    //   - 金額：所有狀態都用 schedule 反推到該月底 → 看到完整還款軌跡
    //       初始金額 (起始月)：
    //         狀態 3/5 = loanAmount - 進入呆帳前已還本金
    //         狀態 4 = record.arrears (手動設定的結算金額)
    //   - 起始月 = 最後一次本金+利息都繳的下一個月
    const monthData = months.map(monthKey => {
        const [y, mo] = monthKey.split('-').map(Number);
        const monthEnd = new Date(y, mo, 0, 23, 59, 59);
        let count = 0, amount = 0, newCount = 0, newAmount = 0;
        cases.forEach(({ record, startDate, currentArrears, loanAmount, scheduleEntries, isStatus3, isStatus4, isStatus5, isExecuted }) => {
            // ★ 強制執行已結案 → 排除
            if (isExecuted) return;
            let includeThisMonth = false;
            let startKey = null;
            if (startDate) {
                startKey = `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, '0')}`;
                if (monthKey >= startKey) includeThisMonth = true;
            } else {
                // 沒日期的案件：只出現在「現在這個月」
                if (monthKey === lastMonth) includeThisMonth = true;
            }
            if (!includeThisMonth) return;
            // 計算該月底的待追回金額
            // ★ 用戶規則：狀態 3/4/5 全部用 schedule 反推 (看到還款軌跡)
            //   - 狀態 3 (走法律/強制執行): loanAmount - 進入呆帳前已還本金
            //   - 狀態 4 (已結案呆帳): record.arrears + 進入呆帳後已還本金
            //   - 狀態 5 (協商中): loanAmount - 進入呆帳前已還本金
            // ★ 當月 (lastMonth)：用 currentArrears 對齊 Dashboard (原始呆帳 - 全部已還 = 現在剩餘)
            // 防呆：所有狀態都套用 fallback (initial < currentArrears → fallback)
            let balance;
            // ★ 統一公式 (3/4/5 適用)：
            //   進入呆帳時的金額 = currentArrears (現在剩餘) + paidAfterAll (進入呆帳後已還本金總和)
            //   該月底 balance = 進入呆帳時金額 - 該月底前已還本金 (看到還款軌跡下降)
            // ★ 當月 (lastMonth)：直接用 currentArrears 對齊 Dashboard
            if (monthKey === lastMonth) {
                balance = currentArrears;
            } else if ((isStatus3 || isStatus4 || isStatus5) && startDate) {
                let initial = currentArrears;
                let paidAfter = 0;
                if (scheduleEntries.length > 0) {
                    // 從進入呆帳月到「現在 (lastMonth 底)」累計已還本金
                    // (避免 schedule 含「未來還款」記錄導致反推偒大)
                    const paidAfterAll = scheduleEntries
                        .filter(e => e.date >= startDate && e.date <= lastMonthEnd)
                        .reduce((s, e) => s + (e.principal || 0), 0);
                    initial = currentArrears + paidAfterAll;  // 進入呆帳時的金額
                    // 從進入呆帳月到該月底 已還本金
                    paidAfter = scheduleEntries
                        .filter(e => e.date >= startDate && e.date <= monthEnd)
                        .reduce((s, e) => s + (e.principal || 0), 0);
                }
                balance = Math.max(0, initial - paidAfter);
            } else {
                // 沒起始月 (不可能) 或 沒 schedule：用 currentArrears
                balance = currentArrears;
            }
            count++;
            amount += balance;
            if (startKey && monthKey === startKey) {
                newCount++;
                // 本期新增金額 = 進入呆帳時的金額 = 起始月 balance
                newAmount += balance;
            }
        });
        return { count, amount, newCount, newAmount };
    });
    // 年資料 = 該年最後一個月的值
    const yearSet = new Set(months.map(m => m.split('-')[0]));
    const years = Array.from(yearSet).sort();
    const yearData = years.map(y => {
        const yearMonths = months.filter(m => m.startsWith(y));
        const lastMonthOfYear = yearMonths[yearMonths.length - 1];
        const lastIdx = months.indexOf(lastMonthOfYear);
        return monthData[lastIdx];
    });
    return { months, monthData, years, yearData };
};
const getBadDebtDetailForPeriod = (period, isMonth) => {
    let targetRecords = state.records;
    if (state.isDemoMode) targetRecords = state.records.filter(r => r.ownerUid === 'demo');
    else if (state.isAdmin && state.viewingUid !== 'all' && state.viewingUid !== null) targetRecords = state.records.filter(r => r.ownerUid === state.viewingUid);
    else if (!state.isAdmin && !state.isDemoMode) targetRecords = state.records.filter(r => r.ownerUid === state.currentUserUid);
    // 狀態 3/4/5 全算
    const badDebtCases = targetRecords.filter(r => {
        const s = String(r.status);
        return s === '3' || s === '4' || s === '5';
    });
    const now = new Date();
    const nowKey = isMonth
        ? `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`
        : `${now.getFullYear()}`;
    const results = [];
    badDebtCases.forEach(record => {
        // ★ 強制執行已結案 → 排除
        if (String(record.executionStatus || '') === 'completed') return;
        const startDate = getBadDebtStartDate(record);
        let calc;
        try { calc = calculateDerivedData(record); } catch (e) { calc = { arrears: 0 }; }
        const currentArrears = Math.max(0, Number(calc.arrears) || 0);
        let include = false;
        if (startDate) {
            const startKey = isMonth
                ? `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, '0')}`
                : `${startDate.getFullYear()}`;
            // 案件起始年/月 <= 查詢期，表示該查詢期有此案件 (累計型)
            if (startKey <= period) include = true;
        } else {
            // 沒日期的案件：算在「現在」這個期
            if (period === nowKey) include = true;
        }
        if (include) results.push({ record, currentArrears });
    });
    // 欠款降冪排序
    results.sort((a, b) => b.currentArrears - a.currentArrears);
    return results;
};

    const { months, monthData, years, yearData } = computeBadDebtTrend();
    const isMonthView = state.badDebtTrendView === 'month';
    const xAxisData = isMonthView ? months : years;
    const dataArr = isMonthView ? monthData : yearData;
    // 累計值
    const cumAmountData = dataArr.map(d => d.amount);
    const option = {
        title: { text: isMonthView?'近12個月呆帳待追回金額':'歷年呆帳待追回金額', left:'center', top: 2, textStyle:{ fontSize:14, fontWeight:'normal' } },
        tooltip: {
            trigger:'axis',
            formatter: (params) => {
                if (!params || params.length === 0) return '';
                const period = params[0].axisValue;
                const d = dataArr[params[0].dataIndex];
                return `<div style="font-weight:bold;margin-bottom:4px;">${period}${isMonthView?'':' 年'}</div>
                    <div style="color:#9ca3af;font-size:11px;margin-bottom:4px;">該月底仍待追回的呆帳餘額</div>
                    <div style="color:#9ca3af;font-size:11px;margin-bottom:4px;">本期新增：<b>${d.newCount}</b> 件 / $${formatNumber(d.newAmount)}</div>
                    <div style="color:#9ca3af;font-size:11px;margin-bottom:4px;">累計件數：<b>${d.count}</b> 件</div>
                    <div style="color:#be123c;">● 呆帳待追回金額：<b>$${formatNumber(d.amount)}</b></div>`;
            }
        },
        legend: { data: ['呆帳待追回金額'], top: 28 },
        // ★ 只剩一張子圖：金額 line (件數在 tooltip 顯示)
        grid: { left: '8%', right: '8%', top: 60, bottom: '18%', containLabel: true },
        xAxis: { type:'category', data:xAxisData, axisLabel:{ rotate:45, interval:0, fontSize: 10 } },
        yAxis: { type:'value', name:'金額 (NTD)', nameTextStyle:{ padding:[0,0,5,0] }, axisLabel:{ formatter:(v)=>`$${formatNumber(v)}`, color:'#9d174d', fontSize: 10 } },
        series: [
            { name:'呆帳待追回金額', data:cumAmountData, type:'line', smooth:true, symbol:'circle', symbolSize:6, lineStyle:{ width:2.5, color:'#be123c' }, itemStyle:{ color:'#be123c' }, areaStyle:{ opacity:0.15, color:'#be123c' } }
        ],
        dataZoom: [{ type:'slider', start:0, end:100, bottom:2, height: 18 }, { type:'inside', start:0, end:100 }],
        toolbox: { feature: { saveAsImage: { title:'儲存為圖片' } } }
    };
    badDebtTrendChartInstance = echarts.init(chartDom);
    badDebtTrendChartInstance.setOption(option);
    badDebtTrendChartInstance.off('click');
    badDebtTrendChartInstance.on('click', (params) => {
        if (params.componentType === 'series' && params.dataIndex !== undefined) {
            const period = xAxisData[params.dataIndex];
            const data = dataArr[params.dataIndex];
            // 只要該期有案件累計 (count > 0) 就帶出明細
            if (period && data && data.count > 0) showBadDebtDetailModal(period, isMonthView, data.amount, data.count);
        }
    });
    window.addEventListener('resize', () => badDebtTrendChartInstance?.resize());
};

                let cells = `<td class="p-2 font-bold text-gray-800">${r.borrower} <span class="text-xs font-normal text-gray-400">(${r.displayId||r.caseNumber||''})</span>`;
                if(state.modalType==='monthCollected'){
                    const entries=parseSchedule(r.schedule||''), now=new Date(), currentMonth=now.getMonth(), currentYear=now.getFullYear();
                    const currentMonthEntries=entries.filter(e=>e.date&&e.date.getFullYear()===currentYear&&e.date.getMonth()===currentMonth);
                    const collectedPrincipal=currentMonthEntries.reduce((s,e)=>s+e.principal,0);
                    const collectedInterest=currentMonthEntries.reduce((s,e)=>s+e.interest,0);
                    const collectedTotal=collectedPrincipal+collectedInterest;
                    cells+=`<td class="p-2 text-right font-mono">${formatNumber(collectedPrincipal)}</td><td class="p-2 text-right font-mono">${formatNumber(collectedInterest)}</td><td class="p-2 text-right font-mono font-bold text-emerald-600">${formatNumber(collectedTotal)}</td>`;
                } else if(state.modalType==='monthInterestDiff'){
                    if(!isPaid) cells+=`<td class="p-2 text-right font-mono font-bold text-red-600">${formatNumber(i)}</td>`;
                    else cells+=`<td class="p-2 text-right font-mono text-gray-400">0</td>`;
                    cells+=`<td class="p-2 text-center"><button onclick="window.handleRepaymentSelect('${r.id}'); window.updateState({modalType:null, activeTab:'repayment'});" class="text-blue-600 hover:underline text-xs">${paymentStatusHtml}</button>`;
                } else if(state.modalType==='monthInterestDue'){
                    cells+=`<td class="p-2 text-right font-mono font-bold ${r.status==='5'?'text-purple-600':'text-blue-600'}">${formatNumber(i)}</td><td class="p-2 text-center"><button onclick="window.handleRepaymentSelect('${r.id}'); window.updateState({modalType:null, activeTab:'repayment'});" class="text-blue-600 hover:underline text-xs">${paymentStatusHtml}</button>`;
                } else if(state.modalType==='monthInterestCollected'){
                    const entries=parseSchedule(r.schedule||''), now=new Date(), currentMonth=now.getMonth(), currentYear=now.getFullYear();
                    const currentMonthEntries=entries.filter(e=>e.date&&e.date.getFullYear()===currentYear&&e.date.getMonth()===currentMonth);
                    const collectedInterest=currentMonthEntries.reduce((s,e)=>s+e.interest,0);
                    cells+=`<td class="p-2 text-right font-mono font-bold text-emerald-600">${formatNumber(collectedInterest)}</td>`;
                } else if(state.modalType==='monthDue'||state.modalType==='monthDiff'){
                    cells+=`<td class="p-2 text-right font-mono">${formatNumber(p)}</td><td class="p-2 text-right font-mono">${formatNumber(i)}</td><td class="p-2 text-right font-mono font-bold ${state.modalType==='monthDiff'?'text-red-600':(r.status==='5'?'text-purple-600':'text-blue-600')}">${formatNumber(total)}</td>`;
                } else if(state.modalType==='negotiationDue'||state.modalType==='negotiationCollected'){
                    cells+=`<td class="p-2 text-right font-mono font-bold text-purple-600">${formatNumber(p)}</td>`;
                } else if(state.modalType==='unpaid'){
                    cells+=`<td class="p-2 text-right font-mono text-red-600 font-bold">${formatNumber(total)}</td>`;
                }
                if(state.modalType!=='monthInterestDiff'&&state.modalType!=='monthInterestDue'&&state.modalType!=='monthDue'&&state.modalType!=='monthDiff'&&state.modalType!=='unpaid'){
                    cells+=`<td class="p-2 text-center"><span class="px-2 py-1 rounded text-xs ${status.color}">${status.text}</span>`;
                } else if(state.modalType==='monthInterestDiff'||state.modalType==='monthInterestDue'){
                    cells+=`<td class="p-2 text-center"><span class="px-2 py-1 rounded text-xs ${status.color}">${status.text}</span>`;
                } else {
                    cells+=`<td class="p-2 text-center"><span class="px-2 py-1 rounded text-xs ${status.color}">${status.text}</span>`;
                }
                if(state.modalType!=='unpaid'&&state.modalType!=='monthDiff'&&state.modalType!=='negotiationCollected'&&state.modalType!=='monthInterestCollected'){
                    cells+=`<td class="p-2 text-center"><button onclick="window.updateState({modalType:null}); window.startEdit('${r.id}')" class="text-blue-600 hover:underline text-xs">前往處理</button>`;
                }
                return `<tr class="hover:bg-gray-50 transition-colors">${cells}</tr>`;
            };
        }
        modalHtml += `<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fade-in backdrop-blur-sm"><div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[80vh] flex flex-col"><div class="p-4 flex justify-between items-center text-white shrink-0 bg-gradient-to-r from-blue-600 to-indigo-600"><h3 class="font-bold flex items-center"><i data-lucide="list" class="w-5 h-5 mr-2"></i> 案件列表</h3><button onclick="window.updateState({modalType:null})" class="hover:bg-white/20 p-1 rounded"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-0 overflow-y-auto flex-1"><table class="w-full text-left border-collapse"><thead class="bg-gray-50 text-gray-500 text-xs uppercase sticky top-0">${customHeaders}</thead><tbody class="divide-y divide-gray-100 text-sm">${filteredWithDisplayIds.map(r=>{ const calc=calculateDerivedData(r); const status=getStatusLabel(r.status); return customRowBuilder(r,calc,status); }).join('')}</tbody></table></div></div></div>`;
    }
    // 預覽彈卡改為 body-level 容器，不走 renderApp (避開重畫列表造成捲軸跳動)
    if (state.showTrendModal) {
        modalHtml += buildTrendModalHtml({
            title: '淨收入趨勢圖',
            icon: 'trending-up',
            gradientFrom: 'from-emerald-600',
            gradientTo: 'to-teal-600',
            currentView: state.trendView,
            switchFn: 'switchTrendView',
            closeFn: 'closeTrendModal',
            chartId: 'trendChart'
        });
    }
    app.innerHTML = `<div class="flex h-screen bg-slate-100 font-sans text-gray-800"><div class="w-20 sm:w-64 bg-slate-900 text-white flex flex-col justify-between fixed h-full z-20 transition-all duration-300"><div><div class="p-6 flex items-center justify-center sm:justify-start border-b border-slate-700"><i data-lucide="wallet" class="w-8 h-8 text-emerald-400 mr-0 sm:mr-3"></i><span class="hidden sm:block text-xl font-bold tracking-wider">財務管理</span></div><div class="px-6 py-4 flex items-center border-b border-slate-800 mb-2"><div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${state.isDemoMode?'bg-amber-500':'bg-slate-700'}">${state.isDemoMode?'T':(state.currentUser?state.currentUser.substring(0,2).toUpperCase():'U')}</div><div class="hidden sm:block"><p class="text-xs text-slate-400">${state.isDemoMode?"試用模式":"已登入"}</p><p class="text-sm font-bold text-white truncate w-32">${state.isDemoMode?"訪客 (不儲存)":state.currentUser}</p></div></div><nav class="mt-4 px-4 space-y-2"><button onclick="window.setActiveTab('dashboard')" class="w-full flex items-center p-3 rounded-lg transition-colors ${state.activeTab==='dashboard'?'bg-emerald-600':'hover:bg-slate-800'}"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">營運報表</span></button><button onclick="window.setActiveTab('list')" class="w-full flex items-center p-3 rounded-lg transition-colors ${state.activeTab==='list'?'bg-emerald-600':'hover:bg-slate-800'}"><i data-lucide="database" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">案件列表</span></button><button onclick="window.setActiveTab('repayment')" class="w-full flex items-center p-3 rounded-lg transition-colors ${state.activeTab==='repayment'?'bg-emerald-600':'hover:bg-slate-800'}"><i data-lucide="banknote" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">還款輸入</span></button><button onclick="window.open('user_manual.html', '_blank')" class="w-full flex items-center p-3 rounded-lg transition-colors hover:bg-slate-800"><i data-lucide="book-open" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">使用手冊</span></button>${state.isAdmin&&!state.isDemoMode?`<button onclick="window.setActiveTab('admin')" class="w-full flex items-center p-3 rounded-lg transition-colors ${state.activeTab==='admin'?'bg-emerald-600':'hover:bg-slate-800'}"><i data-lucide="users" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">用戶管理</span></button>`:''}</nav></div><div class="p-4 border-t border-slate-700 space-y-2"><button onclick="window.handleLogout()" class="w-full flex items-center justify-center sm:justify-start p-3 rounded-lg text-slate-400 hover:bg-red-900/30 hover:text-red-400 transition-colors"><i data-lucide="log-out" class="w-5 h-5 mr-0 sm:mr-2"></i><span class="hidden sm:block font-medium">登出系統</span></button></div></div><div class="flex-1 ml-20 sm:ml-64 overflow-x-hidden">${content}</div>${modalHtml}</div>`;
    if (state.activeTab === 'list') {
        setTimeout(() => {
            window.refreshListUI();
            // ★ refreshListUI 填完內容後，才設回捲軸位置
            // (refreshListUI 自己也會設，但設的是 0，所以我們在後面覆蓋)
            requestAnimationFrame(() => {
                restoreListScrollTop();
            });
        }, 50);
    }
    lucide.createIcons();
}
if (firebaseAvailable && !state.isDemoMode) {
    onAuthStateChanged(auth, async (user) => {
        if (state.isDemoMode || state.demoModeLocked) { console.log("在 demo 模式，跳過 Firebase 監聽"); return; }
        if (user) {
            state.currentUser = user.displayName || user.email;
            state.currentUserUid = user.uid;
            state.isDemoMode = false;
            state.demoModeLocked = false;
            if (state.viewingUid === null) state.viewingUid = user.uid;
            const savedLayout = await loadCardLayoutFromFirebase();
            if (savedLayout) state.cardLayout = savedLayout;
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'user_directory'), async (snap) => {
                if (state.isDemoMode || state.demoModeLocked) return;
                const allUsers = snap.docs.map(d => d.data());
                state.usersDirectory = allUsers;
                const myProfile = allUsers.find(u => u.uid === state.currentUserUid);
                if (myProfile) {
                    const newIsAdmin = myProfile.role === 'admin';
                    if (newIsAdmin !== state.isAdmin) {
                        state.isAdmin = newIsAdmin;
                        state.allowedStatus = myProfile.allowedStatus || ['0','1','3','4','5'];
                        renderApp();
                    } else {
                        state.allowedStatus = myProfile.allowedStatus || ['0','1','3','4','5'];
                        if (state.isAdmin) renderApp();
                    }
                }
            });
            if (!state.isLoadingListener) {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'loan_records'), orderBy('date', 'asc'));
                onSnapshot(q, (snapshot) => {
                    if (state.isDemoMode || state.demoModeLocked) return;
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    docs.sort((a,b) => { const da = a.date?new Date(a.date.replace(/\//g,'-')):new Date('9999-12-31'); const db = b.date?new Date(b.date.replace(/\//g,'-')):new Date('9999-12-31'); return da-db; });
                    updateState({ records: docs });
                });
                state.isLoadingListener = true;
            }
        } else {
            if (!state.isDemoMode && !state.demoModeLocked) {
                updateState({ currentUser: null, currentUserUid: null, currentUserName:'Guest', isAdmin:false, allowedStatus:['0','1','3','4','5'], viewingUid:null, usersDirectory:[], isDemoMode:false, demoModeLocked:false, isRegistering:false, authLoading:false, activeTab:'dashboard', records:[], cardLayout:initialCardLayout, editingRecord:null, searchTerm:'', repaymentSearchTerm:'', selectedRepaymentId:'', repaymentDate:new Date().toISOString().split('T')[0], repaymentPrincipal:'', repaymentInterest:'', modalType:null, showAIModal:false, activeModal:{type:null,record:null}, tempScheduleLines:[], isLoadingListener:false, isImporting:false, unpaidFilter:null, batchDeleteMode:false, selectedCasesForBatch:[], activeCasesFilter:true, cardColors:{}, history:[], statusFilter:null });
                formData = { ...initialFormState };
                if (typeof sessionStorage !== 'undefined') sessionStorage.removeItem('firebase:authUser:'+firebaseConfig.apiKey+':'+appId);
                setTimeout(() => { const searchInput=document.getElementById('searchInput'); if(searchInput) searchInput.value=''; },0);
            }
            renderApp();
        }
    });
} else renderApp();
</script>
</body>
</html>
